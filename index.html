<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>忘れ物チェック Ver.2</title><link rel="manifest" href="manifest.json"><style>*{box-sizing:border-box}body{margin:0;background:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222}main{max-width:520px;margin:auto;padding:24px 16px}.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 6px 25px #0001}h1{text-align:center;margin:0 0 4px;font-size:28px}.ver{text-align:center;color:#888;font-size:13px;margin-bottom:18px}.item{display:flex;align-items:center;padding:15px 2px;border-bottom:1px solid #eee;font-size:19px}.item input{width:26px;height:26px;margin-right:14px;accent-color:#333}.progress{text-align:center;color:#777;margin-top:14px;font-size:14px}#result{text-align:center;min-height:90px;margin:18px 0 5px}.okbox{padding:18px;border-radius:18px;background:#e9f7ee}.oktitle{font-size:34px;font-weight:800}.oksub{font-size:17px}.actions{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:10px 15px;font-size:15px}.secondary{background:#eee}.edit{background:#e9eef7}.editpanel{display:none;margin-top:18px;padding-top:15px;border-top:1px solid #eee}.editrow{display:flex;gap:7px;margin:8px 0}.editrow input{flex:1;min-width:0;padding:10px;border:1px solid #ccc;border-radius:10px;font-size:16px}.del{background:#f4dddd}.add{background:#e5f0e8;width:100%;margin-top:4px}.note{font-size:12px;color:#888;text-align:center;margin-top:12px}</style></head><body><main><div class="card"><h1>🎒 忘れ物チェック</h1><div class="ver">Ver.2</div><div id="items"></div><div id="progress" class="progress"></div><div id="result"></div><div class="actions"><button class="secondary" onclick="resetAll()">すべてリセット</button><button class="edit" onclick="toggleEdit()">項目を編集</button></div><div id="editpanel" class="editpanel"><div id="editlist"></div><button class="add" onclick="addItem()">＋ 項目を追加</button><div class="note">項目の変更は自動保存されます。</div></div></div></main><script>const defaults=["スマホ","タバコ","パソコン一式","水筒","財布","時計","空調服"];let names=JSON.parse(localStorage.getItem("wasuremono_names")||"null")||defaults;let checks=[];function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}function render(){const el=document.getElementById("items");el.innerHTML="";checks=[];names.forEach((n,i)=>{const v=localStorage.getItem("wasuremono_check_"+i)==="1";checks.push(v);el.innerHTML+=`<label class="item"><input type="checkbox" ${v?"checked":""} onchange="setCheck(${i},this.checked)"> ${esc(n)}</label>`});update();renderEdit()}function setCheck(i,v){checks[i]=v;localStorage.setItem("wasuremono_check_"+i,v?"1":"0");update()}function update(){const d=checks.filter(Boolean).length,t=names.length;document.getElementById("progress").textContent=`${d} / ${t} 項目チェック済み`;document.getElementById("result").innerHTML=t&&d===t?'<div class="okbox"><div class="oktitle">🎉 OK！</div><div class="oksub">忘れ物なし！</div></div>':""}function resetAll(){for(let i=0;i<names.length;i++)localStorage.removeItem("wasuremono_check_"+i);checks=checks.map(()=>false);document.querySelectorAll('input[type="checkbox"]').forEach(x=>x.checked=false);update()}function toggleEdit(){const p=document.getElementById("editpanel");p.style.display=p.style.display==="block"?"none":"block";renderEdit()}function renderEdit(){const e=document.getElementById("editlist");e.innerHTML="";names.forEach((n,i)=>e.innerHTML+=`<div class="editrow"><input value="${esc(n)}" onchange="renameItem(${i},this.value)"><button class="del" onclick="deleteItem(${i})">削除</button></div>`)}function renameItem(i,v){v=v.trim();if(!v)return;names[i]=v;localStorage.setItem("wasuremono_names",JSON.stringify(names));render();document.getElementById("editpanel").style.display="block"}function deleteItem(i){if(names.length<=1){alert("項目は1つ以上必要です。");return}names.splice(i,1);localStorage.setItem("wasuremono_names",JSON.stringify(names));for(let j=0;j<20;j++)localStorage.removeItem("wasuremono_check_"+j);render();document.getElementById("editpanel").style.display="block"}function addItem(){const v=prompt("追加する項目名を入力してください");if(!v||!v.trim())return;names.push(v.trim());localStorage.setItem("wasuremono_names",JSON.stringify(names));render();document.getElementById("editpanel").style.display="block"}render();</script></body></html>
