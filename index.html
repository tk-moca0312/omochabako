<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>忘れ物チェック</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222}
main{max-width:500px;margin:auto;padding:28px 18px}
.card{background:#fff;border-radius:24px;padding:24px;box-shadow:0 6px 25px #00000012}
h1{text-align:center;margin:0 0 8px;font-size:28px}
.sub{text-align:center;color:#777;margin-bottom:20px}
label{display:flex;align-items:center;padding:17px 4px;border-bottom:1px solid #eee;font-size:20px}
input{width:26px;height:26px;margin-right:15px;accent-color:#333}
#result{text-align:center;font-size:26px;font-weight:700;min-height:38px;margin:22px 0 8px}
.ok{color:#16833a}
.reset{display:block;margin:14px auto 0;padding:10px 20px;border:0;border-radius:12px;background:#eee;font-size:16px}
</style>
</head>
<body>
<main>
<div class="card">
<h1>🎒 忘れ物チェック</h1>
<div class="sub">出発前に7項目を確認</div>
<div id="items"></div>
<div id="result"></div>
<button class="reset" onclick="resetAll()">すべてリセット</button>
</div>
</main>
<script>
const names=["スマホ","タバコ","パソコン一式","水筒","財布","時計","空調服"];
const items=document.getElementById("items");
names.forEach((n,i)=>{
  items.innerHTML+=`<label><input type="checkbox" id="c${i}" onchange="check()"> ${n}</label>`;
});
function check(){
  const boxes=[...document.querySelectorAll('input[type="checkbox"]')];
  document.getElementById("result").innerHTML=
    boxes.every(x=>x.checked)
    ? '<span class="ok">OK！ 忘れ物なし 👍</span>'
    : "";
}
function resetAll(){
  document.querySelectorAll('input[type="checkbox"]').forEach(x=>x.checked=false);
  check();
}
</script>
</body>
</html>
